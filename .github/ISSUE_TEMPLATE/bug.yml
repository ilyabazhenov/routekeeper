name: Ошибка / Bug report
description: Что-то работает не так / Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issue публичные. Не вставляйте сюда пароли, ключи и адреса, которые не хотите показывать.
        Issues are public. Don't paste passwords, keys or addresses you don't want to share.
  - type: input
    id: version
    attributes:
      label: Версия Routekeeper / Routekeeper version
      description: Routekeeper → О программе / About Routekeeper
      placeholder: "0.2.1 (10)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Версия macOS и Mac / macOS version and Mac
      placeholder: "macOS 15.6, MacBook Air M2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Что делали / Steps
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидали и что получилось / Expected and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Диагностика / Diagnostics
      description: |
        Справка → Собрать диагностику… — архив появится на рабочем столе. Просмотрите его и перетащите сюда.
        Help → Collect Diagnostics… — the archive appears on your desktop. Review it, then drag it here.
